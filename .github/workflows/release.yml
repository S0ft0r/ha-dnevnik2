name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v0.1.32.4)"
        required: true
        default: "v0.1.32.4"
      prerelease:
        description: "Отметить как Pre-release (альфа/бета)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Archive
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate integration before packaging
        run: python3 scripts/validate.py

      - name: Build dnevnik2.zip archive
        run: |
          cd custom_components
          zip -r ../dnevnik2.zip dnevnik2 -x "*/__pycache__/*" "*.pyc" "*.pyo"

      - name: Extract latest release notes from CHANGELOG.md
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os
          from pathlib import Path
          import re

          tag = os.environ.get("TAG", "").strip().lstrip("vV")
          ru_text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          ru_match = None
          if tag:
              ver_pattern = rf"(^## \[{re.escape(tag)}\].*?)(?=^---|\Z|^## \[)"
              ru_match = re.search(ver_pattern, ru_text, flags=re.MULTILINE | re.DOTALL)
          if not ru_match:
              fallback_pattern = r"(^## \[.*?)(?=^---|\Z|^## \[)"
              ru_match = re.search(fallback_pattern, ru_text, flags=re.MULTILINE | re.DOTALL)

          ru_notes = ru_match.group(1).strip() if ru_match else "Автоматическая сборка релиза."
          Path("release_notes.md").write_text(ru_notes + "\n", encoding="utf-8")
          EOF

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          IS_PRERELEASE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.prerelease == true || github.event.inputs.prerelease == 'true')) || contains(github.ref_name, '-') }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS="--prerelease"
          else
            RELEASE_FLAGS="--prerelease=false --latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dnevnik2.zip --clobber
            gh release edit "$TAG" --notes-file release_notes.md $RELEASE_FLAGS
          else
            gh release create "$TAG" dnevnik2.zip \
              --target "${{ github.sha }}" \
              --title "Электронный дневник СПб $TAG" \
              --notes-file release_notes.md \
              $RELEASE_FLAGS
          fi
